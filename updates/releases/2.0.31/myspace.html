<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Space - MyCollab</title>
  <link rel="stylesheet" href="style.css?v=1">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --space-bg: #07111f; --space-panel: rgba(15, 23, 42, 0.82); --space-border: rgba(148, 163, 184, 0.2); --space-muted: #94a3b8; --space-accent: #60a5fa; }
    body { min-height: 100vh; margin: 0; padding: 2rem 1rem 3rem; background: radial-gradient(circle at top left, #172554 0, transparent 34rem), var(--space-bg); color: #f8fafc; }
    .space-shell { width: min(1180px, 100%); margin: 0 auto; }
    .space-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; padding-bottom: 1.25rem; border-bottom: 1px solid var(--space-border); }
    .space-brand h1 { display: flex; align-items: center; gap: 0.7rem; margin: 0; color: #fff !important; background: none; -webkit-background-clip: initial; background-clip: initial; -webkit-text-fill-color: #fff; font-family: 'Outfit', 'Segoe UI', sans-serif; font-size: clamp(2rem, 5vw, 3rem); font-weight: 500; }
    .space-brand h1 i { color: var(--space-accent); }
    .space-brand p { margin: 0.45rem 0 0; color: var(--space-muted); }
    .space-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: flex-end; }
    .space-button, .space-quick-action { width: auto; border: 1px solid var(--space-border); border-radius: 0.5rem; padding: 0.5rem 0.7rem; background: rgba(30, 41, 59, 0.82); color: #f8fafc; cursor: pointer; font: inherit; font-size: 0.85rem; }
    .space-button:hover, .space-quick-action:hover { border-color: rgba(96, 165, 250, 0.65); background: rgba(37, 99, 235, 0.2); }
    .space-profile { display: flex; align-items: center; gap: 1.1rem; margin: 1.5rem 0; }
    .space-avatar { display: grid; width: 4.5rem; height: 4.5rem; place-items: center; overflow: hidden; border: 1px solid rgba(96, 165, 250, 0.45); border-radius: 50%; background: #1e3a8a; color: #dbeafe; font-weight: 700; }
    .space-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .space-profile h2 { margin: 0; font-size: 1.45rem; }
    .space-profile p { margin: 0.25rem 0 0; color: var(--space-muted); }
    .space-quick-actions { display: flex; gap: 0.65rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
    .space-dashboard-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
    .space-panel { min-width: 0; padding: 1.15rem; border: 1px solid var(--space-border); border-radius: 0.75rem; background: var(--space-panel); box-shadow: 0 1rem 2.5rem rgba(0, 0, 0, 0.12); }
    .space-panel-wide { grid-column: span 2; }
    .space-panel h2 { display: flex; align-items: center; gap: 0.55rem; margin: 0 0 1rem; font-size: 1rem; }
    .space-panel h2 i { color: var(--space-accent); }
    .space-panel-subtitle { margin: -0.7rem 0 1rem; color: var(--space-muted); font-size: 0.85rem; }
    .space-task-grid, .space-project-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.65rem; }
    .space-task-card, .space-schedule-item, .space-message-item { display: flex; width: 100%; box-sizing: border-box; flex-direction: column; align-items: flex-start; gap: 0.45rem; padding: 0.85rem; border: 1px solid var(--space-border); border-radius: 0.55rem; background: rgba(15, 23, 42, 0.7); color: #f8fafc; text-align: left; cursor: pointer; font: inherit; }
    .space-task-card:hover, .space-schedule-item:hover, .space-message-item:hover { border-color: rgba(96, 165, 250, 0.7); }
    .space-card-title { display: flex; align-items: flex-start; gap: 0.45rem; font-weight: 700; line-height: 1.35; }
    .space-card-title i { color: var(--space-accent); margin-top: 0.15rem; }
    .space-status { font-size: 0.8rem; font-weight: 700; } .space-status.overdue { color: #fca5a5; } .space-status.today { color: #fcd34d; } .space-status.upcoming { color: #93c5fd; }
    .space-card-meta, .space-project-card p, .space-project-card small { color: var(--space-muted); font-size: 0.8rem; }
    .space-card-meta i { width: 1rem; color: #cbd5e1; }
    .space-link { grid-column: 1 / -1; display: block; margin-top: 0.2rem; color: #93c5fd; font-size: 0.85rem; text-decoration: none; }
    .space-schedule-item { flex-direction: row; align-items: center; } .space-schedule-item time { min-width: 4.5rem; color: #93c5fd; font-size: 0.8rem; } .space-schedule-item time small, .space-schedule-item span small, .space-message-item small { display: block; margin-top: 0.2rem; color: var(--space-muted); }
    .space-schedule-item span { min-width: 0; } .space-schedule-item strong, .space-message-item strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .space-project-card { padding: 0.85rem; border: 1px solid var(--space-border); border-radius: 0.55rem; background: rgba(15, 23, 42, 0.7); } .space-project-card p { margin: 0.6rem 0; }
    .space-progress { height: 0.35rem; overflow: hidden; border-radius: 99px; background: #1e293b; } .space-progress i { display: block; height: 100%; border-radius: inherit; background: var(--space-accent); } .space-progress-large { margin: 1rem 0 0.5rem; height: 0.55rem; } .space-percent { color: #bfdbfe; }
    .space-message-item { flex-direction: row; align-items: center; } .space-message-avatar { display: grid; width: 2rem; height: 2rem; flex: 0 0 auto; place-items: center; border-radius: 50%; background: #1d4ed8; font-weight: 700; } .space-message-item > span:nth-child(2) { min-width: 0; flex: 1; overflow: hidden; } .space-message-item small { display: -webkit-box; max-width: 100%; overflow: hidden; overflow-wrap: anywhere; word-break: break-word; -webkit-box-orient: vertical; -webkit-line-clamp: 3; line-height: 1.35; } .space-message-item time { flex: 0 0 auto; color: var(--space-muted); font-size: 0.75rem; white-space: nowrap; }
    .space-metric { display: flex; align-items: baseline; gap: 0.55rem; } .space-metric strong { font-size: 2rem; } .space-metric span { color: var(--space-muted); }
    .space-file-item, .space-activity-item { display: flex; align-items: center; gap: 0.7rem; padding: 0.6rem 0; border-bottom: 1px solid rgba(148, 163, 184, 0.12); color: #f8fafc; text-decoration: none; } .space-file-item > span, .space-activity-item > span { min-width: 0; } .space-file-item small, .space-activity-item small { display: block; margin-top: 0.2rem; color: var(--space-muted); } .space-file-item i, .space-activity-item i { color: var(--space-accent); }
    .space-empty { grid-column: 1 / -1; display: grid; justify-items: center; gap: 0.35rem; padding: 1.25rem 0.5rem; color: var(--space-muted); text-align: center; } .space-empty i { color: #64748b; font-size: 1.5rem; } .space-empty strong { color: #e2e8f0; }
    #spaceError { min-height: 1.2rem; margin-top: 1rem; color: #fca5a5; }
    @media (max-width: 800px) { .space-dashboard-grid { grid-template-columns: 1fr; } .space-panel-wide { grid-column: span 1; } .space-task-grid, .space-project-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 560px) { body { padding: 1rem 0.75rem 2rem; } .space-header { flex-direction: column; } .space-actions { justify-content: flex-start; } .space-task-grid, .space-project-grid { grid-template-columns: 1fr; } .space-quick-action { flex: 1 1 auto; } }
  </style>
</head>
<body>
  <main class="space-shell">
    <header class="space-header">
      <div class="space-brand"><h1><i class="fas fa-layer-group" aria-hidden="true"></i> My Space</h1></div>
      <div class="space-actions">
        <button type="button" class="space-button" onclick="window.location.href='organization-selection.html'"><i class="fas fa-arrow-left" aria-hidden="true"></i> Organizations</button>
        <button type="button" class="space-button" id="logoutButton"><i class="fas fa-right-from-bracket" aria-hidden="true"></i> Logout</button>
      </div>
    </header>
    <section class="space-profile"><div id="spaceAvatar" class="space-avatar" aria-label="Profile picture">ME</div><div><h2 id="spaceUserName">Loading your workspace...</h2><p id="spaceUserMeta">Loading profile</p></div></section>
    <div class="space-dashboard-grid">
      <section class="space-panel"><h2><i class="fas fa-list-check"></i> My tasks</h2><p id="taskSummary" class="space-panel-subtitle"></p><div id="spaceTasks" class="space-task-grid"></div></section>
      <section class="space-panel"><h2><i class="fas fa-calendar-days"></i> My schedule</h2><div id="spaceSchedule"></div></section>
      <section class="space-panel"><h2><i class="fas fa-building"></i> My organizations</h2><div id="spaceProjects" class="space-project-grid"></div></section>
      <section class="space-panel"><h2><i class="fas fa-comments"></i> Recent messages</h2><div id="spaceMessages"></div></section>
      <section class="space-panel"><h2><i class="fas fa-chart-line"></i> Productivity</h2><div id="spaceProductivity"></div></section>
      <section class="space-panel"><h2><i class="fas fa-folder-open"></i> Recent files</h2><div id="spaceFiles"></div></section>
      <section class="space-panel space-panel-wide"><h2><i class="fas fa-bell"></i> Activity</h2><div id="spaceActivity"></div></section>
    </div>
    <p id="spaceError" role="alert"></p>
  </main>
  <script type="module" src="myspace.js?v=4"></script>
</body>
</html>
