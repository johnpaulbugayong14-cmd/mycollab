<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Login - mytaskForMyCollab</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#3b82f6">
  <link rel="stylesheet" href="style.css?v=1">
  <style>
    body {
      background-color: #fee440;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    svg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
    }

    .links {
      position: fixed;
      bottom: 20px;
      right: 20px;
      font-size: 18px;
      font-family: sans-serif;
    }
    a {
      text-decoration: none;
      color: black;
      margin-left: 1em;
    }
    a:hover {
      text-decoration: underline;
    }
    a img.icon {
      display: inline-block;
      height: 1em;
      margin: 0 0 -0.1em 0.3em;
    }
    
    .login-container {
      width: 100%;
      max-width: 520px;
      padding: 1rem;
      position: relative;
      z-index: 1;
    }
    
    .login-card {
      position: relative;
      overflow: hidden;
      background: rgba(30, 41, 59, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(148, 163, 184, 0.2);
      padding: 2.5rem 2rem;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    .login-card::before {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(90deg, transparent 0%, rgba(56, 189, 248, 0.2) 35%, rgba(56, 189, 248, 0.8) 50%, rgba(56, 189, 248, 0.2) 65%, transparent 100%) top/200% 3px no-repeat,
        linear-gradient(90deg, transparent 0%, rgba(56, 189, 248, 0.2) 35%, rgba(56, 189, 248, 0.8) 50%, rgba(56, 189, 248, 0.2) 65%, transparent 100%) bottom/200% 3px no-repeat,
        linear-gradient(180deg, transparent 0%, rgba(56, 189, 248, 0.2) 35%, rgba(56, 189, 248, 0.8) 50%, rgba(56, 189, 248, 0.2) 65%, transparent 100%) left/3px 200% no-repeat,
        linear-gradient(180deg, transparent 0%, rgba(56, 189, 248, 0.2) 35%, rgba(56, 189, 248, 0.8) 50%, rgba(56, 189, 248, 0.2) 65%, transparent 100%) right/3px 200% no-repeat;
      animation: running-lights 3s linear infinite;
      border-radius: inherit;
      box-shadow: inset 0 0 0 1px rgba(56, 189, 248, 0.12);
    }

    .login-card::after {
      content: '';
      position: absolute;
      inset: 8px;
      pointer-events: none;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.08), transparent 40%, rgba(6, 182, 212, 0.08));
      opacity: 0.8;
      filter: blur(8px);
      animation: card-glow 4s ease-in-out infinite alternate;
    }

    @keyframes running-lights {
      0% {
        background-position: -100% top, 100% bottom, left -100%, right 100%;
      }
      50% {
        background-position: 100% top, -100% bottom, left 100%, right -100%;
      }
      100% {
        background-position: -100% top, 100% bottom, left -100%, right 100%;
      }
    }

    @keyframes card-glow {
      0% {
        opacity: 0.6;
        transform: scale(0.998);
      }
      100% {
        opacity: 1;
        transform: scale(1.002);
      }
    }

    .login-header {
      text-align: center;
      margin-bottom: 2rem;
      position: relative;
      z-index: 1;
    }
    
    .login-header h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }
    
    .login-header p {
      color: #94a3b8;
      font-size: 0.95rem;
    }
    
    .forgot-password {
      text-align: right;
      margin-top: 0.75rem;
    }
    
    .forgot-password a {
      color: #3b82f6;
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.3s ease;
    }
    
    .forgot-password a:hover {
      color: #60a5fa;
    }
  </style>
</head>
<body>

<svg preserveAspectRatio="xMidYMid slice" viewBox="10 10 80 80">
    <defs>
        <style>
            @keyframes rotate {
                0% {
                    transform: rotate(0deg);
                }
                100% {
                    transform: rotate(360deg);
                }
            }
            .out-top {
                animation: rotate 20s linear infinite;
                transform-origin: 13px 25px;
            }
            .in-top {
                animation: rotate 10s linear infinite;
                transform-origin: 13px 25px;
            }
            .out-bottom {
                animation: rotate 25s linear infinite;
                transform-origin: 84px 93px;
            }
            .in-bottom {
                animation: rotate 15s linear infinite;
                transform-origin: 84px 93px;
            }
        </style>
    </defs>
    <path fill="#9b5de5" class="out-top" d="M37-5C25.1-14.7,5.7-19.1-9.2-10-28.5,1.8-32.7,31.1-19.8,49c15.5,21.5,52.6,22,67.2,2.3C59.4,35,53.7,8.5,37-5Z"/>
    <path fill="#f15bb5" class="in-top" d="M20.6,4.1C11.6,1.5-1.9,2.5-8,11.2-16.3,23.1-8.2,45.6,7.4,50S42.1,38.9,41,24.5C40.2,14.1,29.4,6.6,20.6,4.1Z"/>
    <path fill="#00bbf9" class="out-bottom" d="M105.9,48.6c-12.4-8.2-29.3-4.8-39.4.8-23.4,12.8-37.7,51.9-19.1,74.1s63.9,15.3,76-5.6c7.6-13.3,1.8-31.1-2.3-43.8C117.6,63.3,114.7,54.3,105.9,48.6Z"/>
    <path fill="#00f5d4" class="in-bottom" d="M102,67.1c-9.6-6.1-22-3.1-29.5,2-15.4,10.7-19.6,37.5-7.6,47.8s35.9,3.9,44.5-12.5C115.5,92.6,113.9,74.6,102,67.1Z"/>
</svg>

<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h1>Welcome Back</h1>
      <p>Sign in to your MyCollab account</p>
    <form onsubmit="event.preventDefault(); login();">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input id="email" type="email" placeholder="your@mycollab.com" required>
      </div>
      
      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Enter your password" required>
      </div>
      
      <div id="loginMessage" class="alert" style="display:none; margin-bottom: 1rem;"></div>
      <button type="submit">Sign In</button>
    </form>
  </div>
</div>

<script type="module" src="auth.js?v=8"></script>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js");
}
</script>

<script type="module" src="update-manager.js"></script>
</body>
</html>
