<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Chat</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #e2e8f0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow-x: hidden;
    }

    body.chat-theme {
      background: var(--chat-interface-gradient) !important;
      color: var(--chat-card-text-color);
    }

    body.chat-theme .chat-header {
      background: var(--chat-header-color) !important;
    }

    body.chat-theme .chat-page-card {
      background: var(--chat-interface-gradient) !important;
    }

    body.chat-theme #chatMessages,
    body.chat-theme .chat-message {
      background: var(--chat-card-color) !important;
    }

    body.chat-theme .chat-header h1,
    body.chat-theme .chat-header h2,
    body.chat-theme .chat-header h3,
    body.chat-theme .chat-header p,
    body.chat-theme .chat-meta {
      color: var(--chat-header-text-color) !important;
    }

    body.chat-theme .chat-message,
    body.chat-theme .chat-message,
    body.chat-theme .chat-message div,
    body.chat-theme .chat-message p {
      color: var(--chat-card-text-color) !important;
    }

    body.chat-theme .chat-reply-btn,
    body.chat-theme .chat-unsend-btn,
    body.chat-theme .chat-react-btn {
      color: var(--chat-accent-color) !important;
    }

    .chat-page {
      min-height: 100vh;
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .chat-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 2rem;
      flex-wrap: wrap;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(10px);
      padding: 1.5rem 2rem;
      border-radius: 1rem;
      border: 1px solid rgba(148, 163, 184, 0.15);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .chat-header-left {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      min-width: 0;
      flex: 1;
    }

    .chat-page-card {
      width: 100%;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(148, 163, 184, 0.15);
      border-radius: 1rem;
      box-shadow: 0 20px 80px rgba(0, 0, 0, 0.3);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      min-height: calc(100vh - 12rem);
    }

    .chat-meta {
      color: #94a3b8;
      font-size: 0.9rem;
      font-weight: 400;
    }

    #chatMessages {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      padding: 1.25rem;
      background: rgba(2, 6, 23, 0.5);
      border-radius: 0.75rem;
      border: 1px solid rgba(148, 163, 184, 0.1);
      margin-bottom: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .chat-message {
      padding: 1rem;
      border-radius: 0.75rem;
      background: rgba(17, 24, 39, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.1);
      word-break: break-word;
      transition: all 0.2s ease;
    }

    .chat-message:hover {
      background: rgba(17, 24, 39, 1);
      border-color: rgba(148, 163, 184, 0.2);
    }

    .pinned-messages-section {
      margin-bottom: 1rem;
      border: 1px solid rgba(250, 204, 21, 0.25);
      border-radius: 0.75rem;
      background: rgba(30, 41, 59, 0.72);
      overflow: hidden;
    }

    .pinned-messages-header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.8rem 1rem;
      border: 0;
      color: #fef3c7;
      background: transparent;
      cursor: pointer;
      text-align: left;
      font: inherit;
      font-weight: 700;
    }

    .pinned-messages-header:hover {
      background: rgba(250, 204, 21, 0.08);
    }

    .pinned-messages-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      padding: 0 0.75rem 0.75rem;
    }

    .pinned-message-item {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      width: 100%;
      padding: 0.7rem;
      border: 1px solid rgba(148, 163, 184, 0.15);
      border-radius: 0.6rem;
      background: rgba(15, 23, 42, 0.65);
      color: #e2e8f0;
      cursor: pointer;
      text-align: left;
      font: inherit;
    }

    .pinned-message-item:hover {
      border-color: rgba(250, 204, 21, 0.45);
      background: rgba(250, 204, 21, 0.08);
    }

    .pinned-message-content {
      min-width: 0;
      flex: 1;
    }

    .pinned-message-sender {
      color: #facc15;
      font-size: 0.78rem;
      font-weight: 700;
    }

    .pinned-message-preview {
      margin-top: 0.2rem;
      overflow: hidden;
      color: #cbd5e1;
      font-size: 0.86rem;
      line-height: 1.35;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .pinned-messages-empty {
      padding: 0.2rem 0.25rem 0.1rem;
      color: #94a3b8;
      font-size: 0.85rem;
    }

    .chat-message strong {
      display: block;
      margin-bottom: 0.5rem;
      color: #3b82f6;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .reply-preview {
      display: none;
      margin-bottom: 1.5rem;
      padding: 1rem;
      border-radius: 0.75rem;
      background: rgba(59, 130, 246, 0.08);
      border: 1px solid rgba(96, 165, 250, 0.25);
      color: #bfdbfe;
      transition: all 0.2s ease;
    }

    .reply-preview.active {
      display: block;
    }

    .reply-preview-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.75rem;
    }

    .reply-preview-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #60a5fa;
      margin-bottom: 0.35rem;
      font-weight: 600;
    }

    .reply-preview-text {
      font-size: 0.95rem;
      color: #e0f2fe;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 60px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .reply-preview-cancel {
      padding: 0;
      border: none;
      border-radius: 50%;
      background: rgba(248, 113, 113, 0.15);
      color: #f97316;
      cursor: pointer;
      font-size: 0.7rem;
      line-height: 1;
      width: 1.4rem;
      height: 1.4rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s ease;
      hover: background 0.2s ease;
    }

    .reply-preview-cancel:hover {
      background: rgba(248, 113, 113, 0.25);
      transform: scale(1.1);
    }

    .chat-reply-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: auto;
      background: rgba(59, 130, 246, 0.12);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.35);
      border-radius: 0.5rem;
      cursor: pointer;
      padding: 0.35rem 0.65rem;
      font-size: 0.8rem;
      line-height: 1;
      white-space: nowrap;
      transition: all 0.2s ease;
      font-weight: 500;
    }

    .chat-reply-btn:hover {
      background: rgba(59, 130, 246, 0.25);
      border-color: rgba(59, 130, 246, 0.5);
    }

    .chat-reply-quote {
      margin-bottom: 0.75rem;
      padding: 0.75rem;
      border-left: 3px solid #3b82f6;
      border-radius: 0.5rem;
      background: rgba(59, 130, 246, 0.08);
      color: #bfdbfe;
      font-size: 0.9rem;
    }

    .chat-reply-quote-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #60a5fa;
      margin-bottom: 0.25rem;
      font-weight: 600;
    }

    .chat-reply-quote-text {
      font-size: 0.9rem;
      color: #e2e8f0;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .chat-message-time {
      color: #94a3b8;
      font-size: 0.8rem;
      margin-top: 0.5rem;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-variant-emoji: text;
      font-variant-numeric: normal;
    }

    .chat-date-separator {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-variant-emoji: text;
      font-variant-numeric: normal;
    }

    .chat-message.search-hidden {
      display: none;
    }

    .chat-message.search-match {
      background: rgba(34, 197, 94, 0.08);
      border-left: 3px solid #22c55e;
    }

    .search-highlight {
      background: rgba(34, 197, 94, 0.3);
      padding: 0.1rem 0.3rem;
      border-radius: 0.25rem;
      color: #4ade80;
      font-weight: 500;
    }

    .chat-image {
      display: block;
      max-width: 280px;
      max-height: 280px;
      border-radius: 0.75rem;
      margin: 0.75rem 0;
      cursor: pointer;
      border: 1px solid rgba(148, 163, 184, 0.2);
      object-fit: cover;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .chat-image:hover {
      transform: scale(1.02);
      border-color: rgba(148, 163, 184, 0.4);
    }

    #chatError {
      color: #f87171;
      padding: 1rem;
      border: 1px solid rgba(248, 113, 113, 0.3);
      border-radius: 0.75rem;
      background: rgba(220, 38, 38, 0.08);
      margin-bottom: 1rem;
      display: none;
      border-left: 4px solid #dc2626;
    }

    #chatControls {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      align-items: flex-end;
    }

    #chatMessageInput {
      flex: 1 1 auto;
      min-width: 0;
      padding: 0.9rem 1.1rem;
      border-radius: 0.75rem;
      border: 1px solid rgba(148, 163, 184, 0.25);
      background: rgba(15, 23, 42, 0.8);
      color: #f8fafc;
      outline: none;
      font-size: 0.95rem;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    #chatMessageInput:focus {
      background: rgba(15, 23, 42, 0.95);
      border-color: rgba(59, 130, 246, 0.5);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    #chatMessageInput::placeholder {
      color: #64748b;
    }

    #chatMessageForm button {
      padding: 0.9rem 1.5rem;
      border: none;
      border-radius: 0.75rem;
      cursor: pointer;
      font-weight: 600;
      color: white;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      transition: all 0.2s ease;
      font-size: 0.95rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    #chatMessageForm button:hover {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(59, 130, 246, 0.3);
    }

    #chatMessageForm button[type="button"] {
      background: rgba(99, 102, 241, 0.15);
      color: #818cf8;
      border: 1px solid rgba(99, 102, 241, 0.35);
      padding: 0.9rem 1rem;
    }

    #chatMessageForm button[type="button"]:hover {
      background: rgba(99, 102, 241, 0.25);
    }

    #chatImagePreview {
      display: none;
      padding: 1rem;
      border-radius: 0.75rem;
      background: rgba(17, 24, 39, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.15);
      margin-bottom: 1rem;
    }

    #chatImagePreview img {
      max-width: 100%;
      border-radius: 0.75rem;
      display: block;
      margin-bottom: 0.75rem;
      border: 1px solid rgba(148, 163, 184, 0.2);
    }

    .chat-album-button {
      padding: 0.65rem 1rem;
      background: rgba(99, 102, 241, 0.15);
      color: #818cf8;
      border: 1px solid rgba(99, 102, 241, 0.35);
      border-radius: 0.75rem;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      white-space: nowrap;
      outline: none;
      line-height: 1;
      transition: all 0.2s ease;
    }

    .chat-album-button:hover {
      background: rgba(99, 102, 241, 0.25);
      border-color: rgba(99, 102, 241, 0.5);
    }

    #chatAlbumModal {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.98);
      z-index: 99999;
      display: flex;
      flex-direction: column;
      padding: 2rem;
      backdrop-filter: blur(10px);
    }

    .chat-album-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid rgba(148, 163, 184, 0.2);
      gap: 1rem;
    }

    .chat-album-header h2 {
      margin: 0;
      font-size: 1.75rem;
      color: #f8fafc;
      flex: 1;
      font-weight: 600;
    }

    .chat-album-close-btn {
      padding: 0;
      width: 2.5rem;
      height: 2.5rem;
      background: rgba(248, 113, 113, 0.15);
      color: #f97316;
      border: 1px solid rgba(248, 113, 113, 0.35);
      border-radius: 0.5rem;
      cursor: pointer;
      font-size: 1.1rem;
      font-weight: 600;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .chat-album-close-btn:hover {
      background: rgba(248, 113, 113, 0.25);
      border-color: rgba(248, 113, 113, 0.5);
    }

    #chatAlbumGrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 1rem;
      overflow-y: auto;
      flex: 1;
    }

    .chat-album-thumbnail {
      aspect-ratio: 1;
      border-radius: 0.75rem;
      overflow: hidden;
      border: 1px solid rgba(148, 163, 184, 0.2);
      cursor: pointer;
      transition: all 0.3s ease;
      background: rgba(17, 24, 39, 0.8);
    }

    .chat-album-thumbnail:hover {
      transform: scale(1.08);
      border-color: rgba(59, 130, 246, 0.5);
      box-shadow: 0 8px 16px rgba(59, 130, 246, 0.2);
    }

    .chat-album-thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .chat-album-empty {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 300px;
      color: #94a3b8;
      font-size: 1.1rem;
      text-align: center;
    }

    @media (max-width: 900px) {
      .chat-page {
        padding: 1rem;
      }
      .chat-page-card {
        min-height: calc(100vh - 8rem);
        padding: 1rem;
      }
      .chat-header {
        flex-direction: column;
        align-items: stretch;
        gap: 1rem;
        padding: 1rem;
      }
      .chat-header-left {
        width: 100%;
      }
      #chatMessageForm {
        flex-direction: column;
        gap: 0.5rem;
      }
      #chatMessageForm > div:first-child {
        width: 100%;
        order: 1;
      }
      #chatMessageForm button[type="button"] {
        width: 100%;
        order: 2;
      }
      #chatMessageForm button[type="submit"] {
        width: 100%;
        order: 3;
      }
    }

    @media (max-width: 640px) {
      .chat-page {
        padding: 0.75rem;
      }
      .chat-header {
        padding: 0.75rem;
        gap: 0.75rem;
      }
      .chat-page-card {
        padding: 0.75rem;
        min-height: calc(100vh - 4rem);
      }
      .chat-header-left {
        gap: 0.25rem;
      }
      #chatTitle {
        font-size: 1.4rem;
      }
      #chatMessages {
        padding: 0.75rem;
        margin-bottom: 1rem;
      }
      .chat-message {
        padding: 0.75rem;
        margin-bottom: 0.5rem;
      }
      #chatMessageForm {
        gap: 0.5rem;
      }
      #chatMessageForm button {
        padding: 0.7rem 1rem;
        font-size: 0.9rem;
      }
      #chatMessageInput {
        padding: 0.8rem 0.9rem;
        font-size: 0.95rem;
        rows: 2;
      }
      #chatAlbumGrid {
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      }
      #chatAlbumModal {
        padding: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="chat-page">
    <div class="chat-header">
      <div class="chat-header-left">
        <div style="display: flex; gap: 1rem; align-items: center; margin-bottom: 0.5rem;">
          <button id="backButton" style="background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(96, 165, 250, 0.35); border-radius: 0.5rem; padding: 0.65rem 1rem; cursor: pointer; width: fit-content; font-weight: 600; transition: all 0.2s ease;"><i class="fas fa-chevron-left"></i> Back</button>
          <h1 id="chatTitle" style="margin: 0; font-size: 1.8rem; color: #f8fafc; font-weight: 600;"><i class="fas fa-comments"></i> Live Chat</h1>
        </div>
        <p id="chatMeta" class="chat-meta"><i class="fas fa-circle" style="color: #10b981; font-size: 0.6rem;"></i> Loading chat...</p>
      </div>
      <div style="display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center; justify-content: flex-end;">
        <span id="chatStatus" style="padding: 0.5rem 0.9rem; border-radius: 0.5rem; background: rgba(16, 185, 129, 0.15); color: #10b981; font-size: 0.9rem; border: 1px solid rgba(16, 185, 129, 0.3); font-weight: 500;"><i class="fas fa-circle" style="font-size: 0.6rem;"></i> Active</span>
        <button id="chatAlbumButton" class="chat-album-button"><i class="fas fa-images"></i> Images</button>
        <div id="chatSearchContainer" style="display: flex; gap: 0.5rem; align-items: center;">
          <input id="chatSearchInput" type="text" placeholder="Search messages..." style="padding: 0.65rem 0.95rem; border-radius: 0.5rem; border: 1px solid rgba(148, 163, 184, 0.25); background: rgba(15, 23, 42, 0.8); color: #f8fafc; outline: none; min-width: 200px; font-size: 0.9rem; transition: all 0.2s ease;" />
          <span id="chatSearchResultsCount" style="color: #94a3b8; font-size: 0.85rem; white-space: nowrap;"></span>
          <button id="chatClearSearchButton" type="button" style="display: none; padding: 0.65rem 0.95rem; border-radius: 0.5rem; border: 1px solid rgba(248, 113, 113, 0.3); background: rgba(248, 113, 113, 0.15); color: #f97316; cursor: pointer; font-size: 0.85rem; font-weight: 600; transition: all 0.2s ease;"><i class="fas fa-times"></i> Clear</button>
        </div>
      </div>
    </div>

    <div class="chat-page-card">
      <div id="chatError"></div>
      <section id="pinnedMessagesSection" class="pinned-messages-section" aria-label="Pinned messages">
        <button type="button" id="pinnedMessagesToggle" class="pinned-messages-header" aria-expanded="true">
          <span><i class="fas fa-thumbtack"></i> Pinned messages <span id="pinnedMessagesCount">0</span></span>
          <i id="pinnedMessagesChevron" class="fas fa-chevron-up" aria-hidden="true"></i>
        </button>
        <div id="pinnedMessagesList" class="pinned-messages-list"></div>
      </section>
      <div id="chatMessages"></div>
      <div id="chatImagePreview"></div>
      <div id="replyPreview" class="reply-preview">
        <div class="reply-preview-row">
          <div>
            <div class="reply-preview-label"><i class="fas fa-reply"></i> Replying to</div>
            <div id="replyPreviewText" class="reply-preview-text"></div>
          </div>
          <button type="button" id="cancelReplyButton" class="reply-preview-cancel"><i class="fas fa-times"></i></button>
        </div>
      </div>
      <form id="chatMessageForm" autocomplete="off" style="display: flex; gap: 0.5rem; align-items: flex-end;">
        <div style="flex: 1 1 auto; min-width: 0; position: relative; display: flex; align-items: stretch;">
          <textarea id="chatMessageInput" rows="2" placeholder="Type your message here..." style="width:100%; min-width:0; resize: vertical; font-family: inherit;"></textarea>
          <div id="chatMentionDropdown" class="mention-dropdown"></div>
        </div>
        <button type="button" id="attachImageButton" style="padding: 0.65rem 0.75rem; background: rgba(99, 102, 241, 0.15); color: #818cf8; border: 1px solid rgba(99, 102, 241, 0.35); border-radius: 0.75rem; cursor: pointer; font-size: 1rem; transition: all 0.2s ease; display: flex; align-items: center; gap: 0.4rem; white-space: nowrap;"><i class="fas fa-paperclip"></i> Attachment</button>
        <button type="submit" style="padding: 0.65rem 1.2rem; border: none; border-radius: 0.75rem; cursor: pointer; font-weight: 600; color: white; background: linear-gradient(135deg, #3b82f6, #2563eb); transition: all 0.2s ease;"><i class="fas fa-paper-plane"></i> Send</button>
        <input id="chatImageInput" type="file" accept="image/*,.jpg,.jpeg,.png,.gif,.webp,.bmp,.svg,.ico,.tif,.tiff,.heic,.heif,.avif,.jfif" style="display:none;" />
      </form>
    </div>
  </div>

  <div id="chatAlbumModal" style="display: none;">
    <div class="chat-album-header">
      <h2><i class="fas fa-images"></i> Image Gallery</h2>
      <button type="button" class="chat-album-close-btn" onclick="closeChatAlbum(); return false;"><i class="fas fa-times"></i></button>
    </div>
    <div id="chatAlbumGrid"></div>
  </div>

  <script type="module" src="chat.js"></script>
  <script type="module" src="update-manager.js"></script>
</body>
</html>
