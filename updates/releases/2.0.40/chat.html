<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Chat</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #e2e8f0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow-x: hidden;
    }

    body.chat-theme {
      background: var(--chat-interface-gradient) !important;
      color: var(--chat-card-text-color);
    }

    body.chat-theme .chat-header {
      background: var(--chat-header-color) !important;
    }

    body.chat-theme .chat-page-card {
      background: var(--chat-interface-gradient) !important;
    }

    body.chat-theme #chatMessages,
    body.chat-theme .chat-message {
      background: var(--chat-card-color) !important;
    }

    body.chat-theme .chat-header h1,
    body.chat-theme .chat-header h2,
    body.chat-theme .chat-header h3,
    body.chat-theme .chat-header p,
    body.chat-theme .chat-meta {
      color: var(--chat-header-text-color) !important;
    }

    body.chat-theme .chat-message,
    body.chat-theme .chat-message,
    body.chat-theme .chat-message div,
    body.chat-theme .chat-message p {
      color: var(--chat-card-text-color) !important;
    }

    body.chat-theme .chat-message {
      background: transparent !important;
    }

    body.chat-theme .chat-message-content {
      background: rgba(15, 23, 42, 0.78) !important;
      border-color: rgba(255, 255, 255, 0.18) !important;
      color: #f8fafc !important;
    }

    body.chat-theme .chat-reply-btn,
    body.chat-theme .chat-unsend-btn,
    body.chat-theme .chat-react-btn {
      color: var(--chat-accent-color) !important;
    }

    .chat-page {
      min-height: 100vh;
      padding: 0.75rem 0.75rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .chat-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 2rem;
      flex-wrap: wrap;
      background: transparent;
      backdrop-filter: none;
      padding: 0;
      border-radius: 0;
      border: none;
      box-shadow: none;
    }

    .chat-header-left {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      min-width: 0;
      flex: 1;
    }

    .chat-page-card {
      width: 100%;
      background: transparent;
      border: none;
      border-radius: 0;
      box-shadow: none;
      padding: 0;
      display: flex;
      flex-direction: column;
      min-height: calc(100vh - 3rem);
    }

    .chat-meta {
      color: #94a3b8;
      font-size: 0.9rem;
      font-weight: 400;
    }

    #chatMessages {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      padding: 0.5rem 0.5rem 0.25rem;
      background: transparent;
      border-radius: 0;
      border: none;
      margin-bottom: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      scrollbar-width: thin;
      scrollbar-color: rgba(148, 163, 184, 0.38) transparent;
    }

    #chatMessages::-webkit-scrollbar {
      width: 6px;
    }

    #chatMessages::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.38);
      border-radius: 999px;
    }

    .chat-loading-state {
      display: flex;
      flex: 1 1 auto;
      min-height: 8rem;
      align-items: center;
      justify-content: center;
      gap: 0.65rem;
      color: #cbd5e1;
      font-size: 0.85rem;
    }

    .chat-loading-dots {
      display: inline-flex;
      align-items: center;
      gap: 0.22rem;
    }

    .chat-loading-dot {
      width: 0.38rem;
      height: 0.38rem;
      border-radius: 50%;
      background: #93c5fd;
      animation: chat-loading-dance 0.9s ease-in-out infinite;
    }

    .chat-loading-dot:nth-child(2) {
      animation-delay: 0.15s;
    }

    .chat-loading-dot:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes chat-loading-dance {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.45; }
      30% { transform: translateY(-0.3rem); opacity: 1; }
    }

    .chat-message {
      width: 100%;
      max-width: none;
      padding: 0.35rem 0.25rem;
      border-radius: 0;
      background: transparent;
      border: none;
      box-shadow: none;
      word-break: break-word;
      transition: none;
    }

    .chat-message:hover {
      background: transparent;
      border-color: transparent;
      box-shadow: none;
    }

    .pinned-messages-section {
      margin-bottom: 1rem;
      border: 1px solid rgba(250, 204, 21, 0.25);
      border-radius: 0.75rem;
      background: rgba(30, 41, 59, 0.72);
      overflow: hidden;
    }

    .pinned-messages-header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.8rem 1rem;
      border: 0;
      color: #fef3c7;
      background: transparent;
      cursor: pointer;
      text-align: left;
      font: inherit;
      font-weight: 700;
    }

    .pinned-messages-header:hover {
      background: rgba(250, 204, 21, 0.08);
    }

    .pinned-messages-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      padding: 0 0.75rem 0.75rem;
    }

    .pinned-message-item {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      width: 100%;
      padding: 0.7rem;
      border: 1px solid rgba(148, 163, 184, 0.15);
      border-radius: 0.6rem;
      background: rgba(15, 23, 42, 0.65);
      color: #e2e8f0;
      cursor: pointer;
      text-align: left;
      font: inherit;
    }

    .pinned-message-item:hover {
      border-color: rgba(250, 204, 21, 0.45);
      background: rgba(250, 204, 21, 0.08);
    }

    .pinned-message-content {
      min-width: 0;
      flex: 1;
    }

    .pinned-message-sender {
      color: #facc15;
      font-size: 0.78rem;
      font-weight: 700;
    }

    .pinned-message-preview {
      margin-top: 0.2rem;
      overflow: hidden;
      color: #cbd5e1;
      font-size: 0.86rem;
      line-height: 1.35;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .pinned-messages-empty {
      padding: 0.2rem 0.25rem 0.1rem;
      color: #94a3b8;
      font-size: 0.85rem;
    }

    .chat-message strong {
      display: block;
      margin-bottom: 0.5rem;
      color: #3b82f6;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .reply-preview {
      display: none;
      margin: 0 0 0.75rem;
      padding: 0.55rem 0.7rem 0.55rem 0.8rem;
      border-radius: 0.65rem;
      background: rgba(15, 23, 42, 0.55);
      border: 1px solid rgba(96, 165, 250, 0.18);
      border-left: 3px solid rgba(96, 165, 250, 0.8);
      color: #bfdbfe;
      transition: all 0.2s ease;
    }

    .reply-preview.active {
      display: block;
    }

    .reply-preview-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.6rem;
    }

    .reply-preview-label {
      font-size: 0.68rem;
      letter-spacing: 0.02em;
      color: #93c5fd;
      margin-bottom: 0.3rem;
      font-weight: 600;
    }

    .reply-preview-text {
      font-size: 0.82rem;
      color: #dbeafe;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 44px;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.4;
    }

    .reply-preview-cancel {
      padding: 0;
      border: none;
      border-radius: 0;
      background: transparent;
      color: #94a3b8;
      cursor: pointer;
      font-size: 0.8rem;
      line-height: 1;
      width: 1rem;
      height: 1rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s ease;
      margin-top: 0.05rem;
    }

    .reply-preview-cancel:hover {
      color: #f8fafc;
      background: transparent;
      transform: none;
    }

    .chat-reply-btn,
    .chat-pin-btn,
    .chat-react-btn,
    .chat-unsend-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: auto;
      background: transparent;
      color: #94a3b8;
      border: none;
      border-radius: 0;
      cursor: pointer;
      padding: 0;
      font-size: 0.72rem;
      line-height: 1;
      white-space: nowrap;
      transition: color 0.2s ease;
      font-weight: 500;
    }

    .chat-reply-btn {
      color: #60a5fa;
    }

    .chat-reply-btn:hover,
    .chat-pin-btn:hover,
    .chat-react-btn:hover,
    .chat-unsend-btn:hover {
      color: #e2e8f0;
      background: transparent;
      border-color: transparent;
    }

    .chat-reply-quote {
      display: inline-block;
      width: fit-content;
      max-width: min(100%, 34rem);
      margin: 0.25rem 0 0.55rem;
      padding: 0.45rem 0.65rem;
      border-left: 2px solid #3b82f6;
      border-radius: 0.35rem;
      background: rgba(59, 130, 246, 0.08);
      color: #bfdbfe;
      font-size: 0.78rem;
      line-height: 1.35;
      vertical-align: top;
    }

    .chat-reply-quote-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: #60a5fa;
      margin-bottom: 0.15rem;
      font-weight: 600;
    }

    .chat-reply-quote-text {
      font-size: 0.78rem;
      color: #e2e8f0;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow: hidden;
    }

    .chat-message-time {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      flex-shrink: 0;
      color: #e2e8f0;
      background: transparent;
      border: none;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif !important;
      font-size: 0.74rem;
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0.035em;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      font-variant-emoji: text;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      margin-left: auto;
    }

    .chat-date-separator {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0;
      border: none;
      border-radius: 0;
      background: transparent;
      color: #cbd5e1;
      font-family: Arial, Helvetica, sans-serif !important;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      white-space: nowrap;
      font-variant-emoji: text;
      box-shadow: none;
    }

    .chat-date-separator-wrap {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin: 1.25rem 0 0.75rem;
    }

    .chat-date-separator-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(96, 165, 250, 0.28));
    }

    .chat-date-separator-line:last-child {
      background: linear-gradient(90deg, rgba(96, 165, 250, 0.28), transparent);
    }

    .chat-sent-label {
      display: none;
    }

    .chat-message-header {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      margin-bottom: 0.2rem;
      min-width: 0;
    }

    .chat-message-author {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      min-width: 0;
      flex: 1;
    }

    .chat-message-author-name {
      color: #f8fafc;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: 0;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .chat-message-content {
      display: block;
      width: fit-content;
      max-width: calc(100% - 2.3rem);
      min-width: 0;
      margin-left: 2.3rem;
      padding: 0.7rem 0.85rem;
      border-radius: 0.9rem;
      background: rgba(15, 23, 42, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.2);
      color: #f8fafc;
      font-family: Arial, Helvetica, sans-serif !important;
      font-variant-emoji: text;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .chat-link {
      color: #bfdbfe;
      text-decoration: underline;
      text-decoration-color: rgba(191, 219, 254, 0.7);
      text-underline-offset: 2px;
    }

    .chat-link:hover {
      color: #ffffff;
      text-decoration-color: currentColor;
    }

    .chat-message-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-top: 0.4rem;
      margin-left: 2.3rem;
      padding-bottom: 0.05rem;
    }

    .chat-action-separator {
      color: #475569;
      font-size: 0.72rem;
      line-height: 1;
      user-select: none;
    }

    #chatReactionMenu {
      justify-content: center !important;
      align-items: center !important;
    }

    #chatReactionMenu button {
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      text-align: center !important;
      line-height: 1 !important;
    }

    #chatReactionMenu button span {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      line-height: 1;
    }

    .chat-message.search-hidden {
      display: none;
    }

    .chat-message.search-match {
      background: rgba(34, 197, 94, 0.08);
      border-left: 3px solid #22c55e;
    }

    .search-highlight {
      background: rgba(34, 197, 94, 0.3);
      padding: 0.1rem 0.3rem;
      border-radius: 0.25rem;
      color: #4ade80;
      font-weight: 500;
    }

    .chat-image {
      display: block;
      width: auto;
      max-width: 100%;
      height: auto;
      max-height: 22rem;
      border-radius: 0.75rem;
      margin: 0.75rem 0;
      cursor: pointer;
      border: 1px solid rgba(148, 163, 184, 0.2);
      object-fit: contain;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .chat-image:hover {
      transform: scale(1.02);
      border-color: rgba(148, 163, 184, 0.4);
    }

    #chatError {
      color: #f87171;
      padding: 1rem;
      border: 1px solid rgba(248, 113, 113, 0.3);
      border-radius: 0.75rem;
      background: rgba(220, 38, 38, 0.08);
      margin-bottom: 1rem;
      display: none;
      border-left: 4px solid #dc2626;
    }

    #chatControls {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      align-items: flex-end;
    }

    #chatMessageForm {
      display: flex;
      align-items: flex-end;
      gap: 0.45rem;
      width: 100%;
      padding: 0.15rem 0;
      flex-wrap: nowrap;
      flex-direction: row;
    }

    #chatMessageInput {
      flex: 1 1 auto;
      min-width: 0;
      width: 100%;
      min-height: 3.05rem;
      max-height: 9rem;
      padding: 0.75rem 1rem;
      border-radius: 1rem;
      border: 1px solid rgba(148, 163, 184, 0.18);
      background: rgba(255, 255, 255, 0.08);
      color: #f8fafc;
      outline: none;
      font-size: 0.95rem;
      transition: all 0.2s ease;
      font-family: Arial, Helvetica, sans-serif !important;
      font-variant-emoji: text !important;
      font-variant-numeric: normal;
      text-rendering: optimizeLegibility;
      resize: none !important;
      overflow-y: auto !important;
      scrollbar-width: none;
      margin: 0 !important;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
      order: 3;
    }

    #chatMessageInput::-webkit-scrollbar {
      display: none;
    }

    #chatMessageInput:focus {
      background: rgba(15, 23, 42, 0.95);
      border-color: rgba(59, 130, 246, 0.5);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    #chatMessageInput::placeholder {
      color: rgba(255, 255, 255, 0.8);
      font-weight: 500;
    }

    #chatMessageForm .chat-message-action {
      width: 2.2rem !important;
      min-width: 2.2rem !important;
      max-width: 2.2rem !important;
      height: 2.2rem !important;
      min-height: 2.2rem !important;
      padding: 0 !important;
      border-radius: 999px !important;
      border: none;
      cursor: pointer;
      display: inline-flex !important;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      font-weight: 700;
      line-height: 1;
      flex-shrink: 0;
      transition: all 0.2s ease;
      margin: 0 !important;
    }

    #chatMessageForm .chat-message-action:hover {
      transform: translateY(-1px);
    }

    #chatMessageForm #attachImageButton {
      background: rgba(168, 85, 247, 0.22);
      color: #e9d5ff;
      border: 1px solid rgba(168, 85, 247, 0.45);
      box-shadow: 0 8px 18px rgba(168, 85, 247, 0.18);
      order: 1;
    }

    #chatMessageForm #submitChatButton {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: #fff;
      box-shadow: 0 8px 18px rgba(59, 130, 246, 0.25);
      order: 2;
    }

    #chatImagePreview {
      display: none;
      padding: 1rem;
      border-radius: 0.75rem;
      background: rgba(17, 24, 39, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.15);
      margin-bottom: 1rem;
    }

    #chatImagePreview img {
      max-width: 100%;
      border-radius: 0.75rem;
      display: block;
      margin-bottom: 0.75rem;
      border: 1px solid rgba(148, 163, 184, 0.2);
    }

    .chat-album-button {
      padding: 0.65rem 1rem;
      background: rgba(99, 102, 241, 0.15);
      color: #818cf8;
      border: 1px solid rgba(99, 102, 241, 0.35);
      border-radius: 0.75rem;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      white-space: nowrap;
      outline: none;
      line-height: 1;
      transition: all 0.2s ease;
    }

    .chat-album-button:hover {
      background: rgba(99, 102, 241, 0.25);
      border-color: rgba(99, 102, 241, 0.5);
    }

    #chatAlbumModal {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.98);
      z-index: 99999;
      display: flex;
      flex-direction: column;
      padding: 2rem;
      backdrop-filter: blur(10px);
    }

    .chat-album-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid rgba(148, 163, 184, 0.2);
      gap: 1rem;
    }

    .chat-album-header h2 {
      margin: 0;
      font-size: 1.75rem;
      color: #f8fafc;
      flex: 1;
      font-weight: 600;
    }

    .chat-album-close-btn {
      padding: 0;
      width: 2.5rem;
      height: 2.5rem;
      background: rgba(248, 113, 113, 0.15);
      color: #f97316;
      border: 1px solid rgba(248, 113, 113, 0.35);
      border-radius: 0.5rem;
      cursor: pointer;
      font-size: 1.1rem;
      font-weight: 600;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .chat-album-close-btn:hover {
      background: rgba(248, 113, 113, 0.25);
      border-color: rgba(248, 113, 113, 0.5);
    }

    #chatAlbumGrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 1rem;
      overflow-y: auto;
      flex: 1;
    }

    .chat-album-thumbnail {
      aspect-ratio: 1;
      border-radius: 0.75rem;
      overflow: hidden;
      border: 1px solid rgba(148, 163, 184, 0.2);
      cursor: pointer;
      transition: all 0.3s ease;
      background: rgba(17, 24, 39, 0.8);
    }

    .chat-album-thumbnail:hover {
      transform: scale(1.08);
      border-color: rgba(59, 130, 246, 0.5);
      box-shadow: 0 8px 16px rgba(59, 130, 246, 0.2);
    }

    .chat-album-thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .chat-album-empty {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 300px;
      color: #94a3b8;
      font-size: 1.1rem;
      text-align: center;
    }

    @media (max-width: 900px) {
      .chat-page {
        padding: 1rem;
      }
      .chat-page-card {
        min-height: calc(100vh - 8rem);
        padding: 1rem;
      }
      .chat-header {
        flex-direction: column;
        align-items: stretch;
        gap: 0.5rem;
        padding: 0.5rem;
        margin-bottom: 0.5rem;
      }
      .chat-header-left {
        width: 100%;
        gap: 0.25rem;
      }
      .chat-header-left > div:first-child {
        gap: 0.5rem !important;
        margin-bottom: 0 !important;
      }
      .chat-header #backButton {
        padding: 0.4rem 0.65rem !important;
        font-size: 0.8rem;
      }
      .chat-header #chatTitle {
        font-size: 1.35rem !important;
        color: #ffffff !important;
        background: none !important;
        -webkit-text-fill-color: #ffffff !important;
        background-clip: border-box !important;
      }
      .chat-header .chat-meta {
        font-size: 0.75rem;
      }
      .chat-header > div:last-child {
        width: 100%;
        gap: 0.4rem !important;
        align-items: center !important;
        justify-content: flex-start !important;
      }
      .chat-header #chatStatus {
        padding: 0.35rem 0.55rem !important;
        font-size: 0.75rem !important;
      }
      .chat-header .chat-album-button {
        width: auto !important;
        max-width: none !important;
        padding: 0.4rem 0.65rem;
        font-size: 0.75rem;
      }
      .chat-header #chatSearchContainer {
        margin-left: auto;
        gap: 0.35rem !important;
      }
      .chat-header #chatSearchInput {
        min-width: 140px !important;
        width: 140px;
        padding: 0.4rem 0.6rem !important;
        font-size: 0.78rem !important;
      }
      #chatMessageForm {
        align-items: flex-end;
        flex-direction: row;
        flex-wrap: nowrap;
        gap: 0.55rem;
      }

      #chatMessageForm .chat-message-action {
        width: 2.75rem !important;
        min-width: 2.75rem !important;
        max-width: 2.75rem !important;
        height: 2.75rem !important;
        min-height: 2.75rem !important;
        font-size: 1rem;
      }

      #chatMessageInput {
        min-height: 2.75rem;
        padding: 0.65rem 0.9rem;
      }
    }

    @media (max-width: 640px) {
      .chat-page {
        padding: 0.75rem;
      }
      .chat-header {
        padding: 0.75rem;
        gap: 0.75rem;
      }
      .chat-page-card {
        padding: 0.75rem;
        min-height: calc(100vh - 4rem);
      }
      .chat-header-left {
        gap: 0.25rem;
      }
      #chatTitle {
        font-size: 1.4rem;
      }
      #chatMessages {
        padding: 0.75rem;
        margin-bottom: 1rem;
      }
      .chat-message {
        padding: 0.75rem;
        margin-bottom: 0.5rem;
      }
      #chatMessageForm {
        align-items: flex-end;
        flex-direction: row;
        flex-wrap: nowrap;
        gap: 0.5rem;
      }

      #chatMessageForm .chat-message-action {
        width: 2.65rem !important;
        min-width: 2.65rem !important;
        max-width: 2.65rem !important;
        height: 2.65rem !important;
        min-height: 2.65rem !important;
      }

      #chatMessageInput {
        min-height: 2.65rem;
        padding: 0.65rem 0.85rem;
        font-size: 0.95rem;
      }
      #chatAlbumGrid {
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      }
      #chatAlbumModal {
        padding: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="chat-page">
    <div class="chat-header">
      <div class="chat-header-left">
        <div style="display: flex; gap: 1rem; align-items: center; margin-bottom: 0.5rem;">
          <button id="backButton" style="background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(96, 165, 250, 0.35); border-radius: 0.5rem; padding: 0.65rem 1rem; cursor: pointer; width: fit-content; font-weight: 600; transition: all 0.2s ease;"><i class="fas fa-chevron-left"></i> Back</button>
          <h1 id="chatTitle" style="margin: 0; font-size: 1.8rem; color: #f8fafc; font-weight: 600;"><i class="fas fa-comments"></i> Live Chat</h1>
        </div>
        <p id="chatMeta" class="chat-meta"><i class="fas fa-circle" style="color: #10b981; font-size: 0.6rem;"></i> Loading chat...</p>
      </div>
      <div style="display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center; justify-content: flex-end;">
        <span id="chatStatus" style="padding: 0.5rem 0.9rem; border-radius: 0.5rem; background: rgba(16, 185, 129, 0.15); color: #10b981; font-size: 0.9rem; border: 1px solid rgba(16, 185, 129, 0.3); font-weight: 500;"><i class="fas fa-circle" style="font-size: 0.6rem;"></i> Active</span>
        <button id="chatAlbumButton" class="chat-album-button"><i class="fas fa-images"></i> Images</button>
        <div id="chatSearchContainer" style="display: flex; gap: 0.5rem; align-items: center;">
          <input id="chatSearchInput" type="text" placeholder="Search messages..." style="padding: 0.65rem 0.95rem; border-radius: 0.5rem; border: 1px solid rgba(148, 163, 184, 0.25); background: rgba(15, 23, 42, 0.8); color: #f8fafc; outline: none; min-width: 200px; font-size: 0.9rem; transition: all 0.2s ease;" />
          <span id="chatSearchResultsCount" style="color: #94a3b8; font-size: 0.85rem; white-space: nowrap;"></span>
          <button id="chatClearSearchButton" type="button" style="display: none; padding: 0.65rem 0.95rem; border-radius: 0.5rem; border: 1px solid rgba(248, 113, 113, 0.3); background: rgba(248, 113, 113, 0.15); color: #f97316; cursor: pointer; font-size: 0.85rem; font-weight: 600; transition: all 0.2s ease;"><i class="fas fa-times"></i> Clear</button>
        </div>
      </div>
    </div>

    <div class="chat-page-card">
      <div id="chatError"></div>
      <section id="pinnedMessagesSection" class="pinned-messages-section" aria-label="Pinned messages">
        <button type="button" id="pinnedMessagesToggle" class="pinned-messages-header" aria-expanded="true">
          <span><i class="fas fa-thumbtack"></i> Pinned messages <span id="pinnedMessagesCount">0</span></span>
          <i id="pinnedMessagesChevron" class="fas fa-chevron-up" aria-hidden="true"></i>
        </button>
        <div id="pinnedMessagesList" class="pinned-messages-list"></div>
      </section>
      <div id="chatMessages"><div class="chat-loading-state" role="status" aria-live="polite"><span class="chat-loading-dots" aria-hidden="true"><span class="chat-loading-dot"></span><span class="chat-loading-dot"></span><span class="chat-loading-dot"></span></span><span>Loading messages...</span></div></div>
      <div id="chatImagePreview"></div>
      <div id="replyPreview" class="reply-preview">
        <div class="reply-preview-row">
          <div>
            <div class="reply-preview-label"><i class="fas fa-reply"></i> Replying to</div>
            <div id="replyPreviewText" class="reply-preview-text"></div>
          </div>
          <button type="button" id="cancelReplyButton" class="reply-preview-cancel"><i class="fas fa-times"></i></button>
        </div>
      </div>
      <form id="chatMessageForm" autocomplete="off" style="position: relative;">
        <button type="button" id="attachImageButton" class="chat-message-action" aria-label="Attach image" title="Attach image" style="order: 1;"><i class="fas fa-paperclip"></i></button>
        <button type="submit" id="submitChatButton" class="chat-message-action" aria-label="Send message" title="Send message" style="order: 2;"><i class="fas fa-paper-plane"></i></button>
        <textarea id="chatMessageInput" rows="2" placeholder="Type your message here..." style="order: 3; width:100%; min-width:0; font-family: inherit; font-size: 0.95rem; padding: 0.9rem 1.15rem; flex: 1 1 auto;"></textarea>
        <div id="chatMentionDropdown" class="mention-dropdown"></div>
        <input id="chatImageInput" type="file" accept="image/*,.jpg,.jpeg,.png,.gif,.webp,.bmp,.svg,.ico,.tif,.tiff,.heic,.heif,.avif,.jfif" style="display:none;" />
      </form>
    </div>
  </div>

  <div id="chatAlbumModal" style="display: none;">
    <div class="chat-album-header">
      <h2><i class="fas fa-images"></i> Image Gallery</h2>
      <button type="button" class="chat-album-close-btn" onclick="closeChatAlbum(); return false;"><i class="fas fa-times"></i></button>
    </div>
    <div id="chatAlbumGrid"></div>
  </div>

  <script type="module" src="chat.js"></script>
  <script type="module" src="update-manager.js"></script>
</body>
</html>
