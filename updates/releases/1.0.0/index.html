<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Login - Task Management System</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#3b82f6">
  <link rel="stylesheet" href="style.css?v=1">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✓</text></svg>">
  <style>
    /* Match login card animations but scoped to this page's container */
    .container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container .card {
      position: relative;
      overflow: hidden;
      background: rgba(30, 41, 59, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(148, 163, 184, 0.2);
      padding: 2.5rem 2rem;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }
    .container .card::before {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(90deg, transparent 0%, rgba(56, 189, 248, 0.2) 35%, rgba(56, 189, 248, 0.8) 50%, rgba(56, 189, 248, 0.2) 65%, transparent 100%) top/200% 3px no-repeat,
        linear-gradient(90deg, transparent 0%, rgba(56, 189, 248, 0.2) 35%, rgba(56, 189, 248, 0.8) 50%, rgba(56, 189, 248, 0.2) 65%, transparent 100%) bottom/200% 3px no-repeat,
        linear-gradient(180deg, transparent 0%, rgba(56, 189, 248, 0.2) 35%, rgba(56, 189, 248, 0.8) 50%, rgba(56, 189, 248, 0.2) 65%, transparent 100%) left/3px 200% no-repeat,
        linear-gradient(180deg, transparent 0%, rgba(56, 189, 248, 0.2) 35%, rgba(56, 189, 248, 0.8) 50%, rgba(56, 189, 248, 0.2) 65%, transparent 100%) right/3px 200% no-repeat;
      animation: running-lights 3s linear infinite;
      border-radius: inherit;
      box-shadow: inset 0 0 0 1px rgba(56, 189, 248, 0.12);
    }
    .container .card::after {
      content: '';
      position: absolute;
      inset: 8px;
      pointer-events: none;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.08), transparent 40%, rgba(6, 182, 212, 0.08));
      opacity: 0.8;
      filter: blur(8px);
      animation: card-glow 4s ease-in-out infinite alternate;
    }

    @keyframes running-lights {
      0% {
        background-position: -100% top, 100% bottom, left -100%, right 100%;
      }
      50% {
        background-position: 100% top, -100% bottom, left 100%, right -100%;
      }
      100% {
        background-position: -100% top, 100% bottom, left -100%, right 100%;
      }
    }

    @keyframes card-glow {
      0% {
        opacity: 0.6;
        transform: scale(0.998);
      }
      100% {
        opacity: 1;
        transform: scale(1.002);
      }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="card" style="max-width: 560px; margin: 0 auto;">
    <h1>Sign In</h1>
    <p style="text-align:center; color:#94a3b8; margin-bottom:1.5rem;">Sign in to your MyCollab account</p>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="your@mycollab.com" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Password" required>
      </div>

      <div id="loginMessage" class="alert" style="display:none;"></div>
      <button type="submit">Continue</button>
    </form>
  </div>
</div>

<script type="module" src="auth.js?v=7"></script>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js");
}

// Wait for the auth module to load, then attach form handler
function attachLoginHandler() {
  const loginForm = document.getElementById('loginForm');
  if (loginForm && window.login) {
    loginForm.addEventListener('submit', function(event) {
      event.preventDefault();
      window.login();
    });
  } else {
    setTimeout(attachLoginHandler, 100);
  }
}

document.addEventListener('DOMContentLoaded', attachLoginHandler);
</script>

<script type="module" src="update-manager.js"></script>
</body>
</html>
