<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Login - My Collab</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#3b82f6">
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body class="login-body">

<div class="login-container">
  <div class="card login-card">
    <div class="login-header">
      <h1>My Collab</h1>
      <p>Sign in to your account</p>
    </div>
    
    <form onsubmit="event.preventDefault(); login();">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input id="email" type="email" placeholder="your@email.com" required>
      </div>
      
      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Enter your password" required>
      </div>
      
      <div id="loginMessage" class="alert" style="display:none; margin-bottom: 1rem;"></div>
      
      <button type="submit">Sign In</button>
    </form>
  </div>
</div>

<footer class="login-footer">
  <div>COLLABORATIVE TASK MANAGEMENT</div>
  <div style="font-size: 0.75rem; margin-top: 0.25rem;">My Collab Platform</div>
</footer>

<script type="module" src="auth.js?v=3"></script>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js");
}
</script>

</body>
</html>
