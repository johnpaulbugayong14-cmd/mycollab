<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Login - mytaskForMyCollab</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#3b82f6">
  <link rel="stylesheet" href="style.css?v=1">
  <style>
    body {
      background-color: #fee440;
    }
    svg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
    }

    .links {
      position: fixed;
      bottom: 20px;
      right: 20px;
      font-size: 18px;
      font-family: sans-serif;
    }
    a {
      text-decoration: none;
      color: black;
      margin-left: 1em;
    }
    a:hover {
      text-decoration: underline;
    }
    a img.icon {
      display: inline-block;
      height: 1em;
      margin: 0 0 -0.1em 0.3em;
    }
  </style>
</head>
<body>

<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h1>Welcome Back</h1>
      <p>Sign in to your MyCollab account</p>
    <form onsubmit="event.preventDefault(); login();">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input id="email" type="email" placeholder="your@mycollab.com" required>
      </div>
      
      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Enter your password" required>
      </div>
      
      <div id="loginMessage" class="alert" style="display:none; margin-bottom: 1rem;"></div>
      <button type="submit">Sign In</button>
    </form>
  </div>
</div>

<script type="module" src="auth.js?v=8"></script>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js");
}
</script>

<script type="module" src="update-manager.js"></script>
</body>
</html>
