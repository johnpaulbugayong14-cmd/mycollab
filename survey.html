<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Survey Participation - My Collab</title>
  <link rel="stylesheet" href="style.css?v=1">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    body { min-height: 100vh; padding: 2rem 1rem; background: linear-gradient(135deg, #0f172a, #1e293b); color: #e2e8f0; }
    .survey-shell { width: min(820px, 100%); margin: 0 auto; }
    .survey-card { background: rgba(15, 23, 42, 0.94); border: 1px solid rgba(148, 163, 184, 0.25); border-radius: 1rem; padding: clamp(1.25rem, 4vw, 2.5rem); box-shadow: 0 20px 70px rgba(0, 0, 0, 0.3); min-width: 0; overflow: hidden; }
    .survey-card form { width: 100%; max-width: 100%; min-width: 0; }
    .survey-card h1, .survey-card p, .survey-card legend, .survey-card label { overflow-wrap: anywhere !important; word-break: break-word !important; }
    .survey-question { width: 100%; max-width: 100%; min-width: 0; min-inline-size: 0; margin-top: 1.25rem; padding: 1rem; border: 1px solid #374151; border-radius: 0.75rem; background: rgba(30, 41, 59, 0.75); box-sizing: border-box; overflow: hidden; }
    .survey-question legend { display: block; width: 100%; max-width: 100%; min-width: 0; padding: 0; color: #f8fafc; font-weight: 600; white-space: normal !important; }
    .survey-question-prompt { display: block; width: 100%; max-width: 100%; min-width: 0; margin: 0; color: #f8fafc; font-weight: 600; line-height: 1.45; overflow-wrap: anywhere; word-break: break-word; white-space: pre-wrap; }
    .survey-question label { color: #f8fafc; font-weight: 600; white-space: pre-wrap; overflow-wrap:anywhere; word-break:break-word; }
    .survey-question textarea { width: 100%; max-width: 100%; box-sizing: border-box; resize: vertical; }
    .survey-suggestion-box { min-height: 7rem; padding: 0.75rem 1rem; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word; }
    .likert-options { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0.5rem; margin-top: 0.75rem; }
    .likert-options label { display: flex; flex-direction: column; align-items: center; gap: 0.35rem; padding: 0.6rem 0.25rem; border: 1px solid #475569; border-radius: 0.5rem; cursor: pointer; font-size: 0.85rem; }
    .survey-submit { margin-top: 1.5rem; width: 100%; padding: 0.85rem 1rem; border: none; border-radius: 0.5rem; background: #10b981; color: white; font-weight: 700; cursor: pointer; }
    .survey-participate { margin-top: 1.25rem; width: 100%; padding: 0.9rem 1rem; border: none; border-radius: 0.5rem; background: #3b82f6; color: white; font-weight: 700; cursor: pointer; }
    .survey-message { padding: 0.8rem 1rem; border-radius: 0.5rem; background: rgba(59, 130, 246, 0.12); border: 1px solid rgba(96, 165, 250, 0.35); color: #bfdbfe; }
    @media (max-width: 520px) { .likert-options { gap: 0.25rem; } .likert-options label { font-size: 0.72rem; } }
  </style>
</head>
<body>
  <main class="survey-shell">
    <div class="survey-card">
      <div id="surveyLoading" class="survey-message">Loading survey...</div>
      <div id="surveyIntro" style="display:none;">
        <h1 id="surveyIntroTitle" style="margin-bottom: 0.75rem; color: #f8fafc;"></h1>
        <p id="surveyIntroDescription" style="color: #cbd5e1; white-space: pre-wrap;"></p>
        <p style="color: #fbbf24; font-size: 0.9rem;"><i class="fas fa-lock"></i> Your participation is required before returning to My Collab.</p>
        <button id="participateNowButton" type="button" class="survey-participate"><i class="fas fa-play"></i> Participate Now</button>
      </div>
      <div id="surveyContent" style="display:none;">
        <h1 id="surveyTitle" style="margin-bottom: 0.75rem; color: #f8fafc;"></h1>
        <p id="surveyDescription" style="color: #cbd5e1; white-space: pre-wrap;"></p>
        <p style="color: #fbbf24; font-size: 0.9rem;"><i class="fas fa-lock"></i> Please submit this survey before returning to My Collab.</p>
        <form id="surveyForm"></form>
      </div>
    </div>
  </main>
  <script type="module" src="survey.js?v=1"></script>
  <script type="module" src="update-manager.js"></script>
</body>
</html>
